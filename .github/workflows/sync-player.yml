name: Sync player page

# The player page is written and reviewed in ibaciu6/rss-generator, where the
# code that builds its links lives (scripts/enrichers/player_servers.py). It is
# *served* from here, so its deploys are independent of that repository's hourly
# feed commits. This job pulls the one file it needs and commits it here; Pages
# builds the resulting push like any other change to this repository.
#
# Pull, not push: a public repository's raw file needs no token here, so no
# credential from rss-generator is stored on this one.

on:
  schedule:
    - cron: "17 3 * * *" # daily, away from the hourly feed run
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-player.yml" # makes the first sync easy to trigger

permissions:
  contents: write

concurrency:
  group: sync-player
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Fetch the page from rss-generator
        run: |
          mkdir -p player
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/ibaciu6/rss-generator/main/player/index.html \
            -o player/index.html
          # Guard the commit, not just the fetch: an empty or error-shaped body
          # would otherwise publish over a working page and the feeds' ▶ Play
          # links would render it.
          test -s player/index.html
          grep -q '<iframe id="player"' player/index.html
          grep -q 'PLAYER_SERVERS' player/index.html

      - name: Commit if it changed
        run: |
          if [ -z "$(git status --porcelain -- player/index.html)" ]; then
            echo "player/index.html is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add player/index.html
          git commit -m "chore(player): sync from rss-generator [skip ci]"
          git push
